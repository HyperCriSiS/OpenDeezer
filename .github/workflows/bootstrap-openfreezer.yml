name: bootstrap-openfreezer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Update Go dependencies and toolchain
        shell: bash
        run: |
          set -euo pipefail
          go mod edit -go=1.25.13
          go get \
            github.com/ebitengine/oto/v3@v3.4.1 \
            github.com/gen2brain/malgo@v0.11.26 \
            github.com/mewkiz/flac@v1.0.14 \
            golang.org/x/crypto@v0.55.0 \
            golang.org/x/net@v0.57.0 \
            golang.org/x/sys@v0.47.0
          go mod tidy

      - name: Update Android and non-workflow dependencies
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(s.replace(old, new))

          Path("gui/android/build.gradle.kts").write_text('''// Top-level build file. Android Gradle Plugin 9 uses built-in Kotlin.\n// Pin KGP explicitly so the built-in compiler and Compose compiler stay in lockstep.\nbuildscript {\n    dependencies {\n        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10")\n    }\n}\n\nplugins {\n    id("com.android.application") version "9.3.1" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.4.10" apply false\n}\n''')

          p = Path("gui/android/app/build.gradle.kts")
          s = p.read_text()
          changes = {
              '    id("org.jetbrains.kotlin.android")\n': '',
              'compileSdk = 34': 'compileSdk = 37',
              'targetSdk = 34': 'targetSdk = 36',
              '    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n': '',
              'androidx.compose:compose-bom:2024.09.03': 'androidx.compose:compose-bom:2026.08.00',
              'androidx.core:core-ktx:1.13.1': 'androidx.core:core-ktx:1.19.0',
              'androidx.media:media:1.7.0': 'androidx.media:media:1.8.0',
              'androidx.activity:activity-compose:1.9.2': 'androidx.activity:activity-compose:1.13.0',
              'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6': 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0',
              'androidx.lifecycle:lifecycle-runtime-compose:2.8.6': 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0',
              'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6': 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0',
              'androidx.navigation:navigation-compose:2.8.0': 'androidx.navigation:navigation-compose:2.9.8',
              'implementation("io.coil-kt:coil-compose:2.7.0")': 'implementation("io.coil-kt.coil3:coil-compose:3.5.0")\n    implementation("io.coil-kt.coil3:coil-network-okhttp:3.5.0")',
          }
          for old, new in changes.items():
              if old not in s:
                  raise SystemExit(f"Expected app Gradle text not found: {old!r}")
              s = s.replace(old, new)
          p.write_text(s)

          replace(
              "gui/android/app/src/main/java/fr/cyclooo/opendeezer/ui/components/Components.kt",
              "import coil.compose.SubcomposeAsyncImage",
              "import coil3.compose.SubcomposeAsyncImage",
          )
          replace(
              "gui/android/gradle/wrapper/gradle-wrapper.properties",
              "gradle-8.7-bin.zip",
              "gradle-9.5.0-bin.zip",
          )

          p = Path("packaging/fdroid/fdroiddata/fr.cyclooo.opendeezer.yml")
          s = p.read_text()
          s = s.replace("go@go1.25.12", "go@go1.25.13")
          s = s.replace("'platforms;android-34'", "'platforms;android-37'")
          s = s.replace("'build-tools;34.0.0'", "'build-tools;36.0.0'")
          s = s.replace("platforms/android-34/android.jar", "platforms/android-37/android.jar")
          s = s.replace("ndk: r26d", "ndk: r28c")
          p.write_text(s)

          Path(".github/dependabot.yml").write_text('''version: 2\nupdates:\n  - package-ecosystem: gomod\n    directory: "/"\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n    groups:\n      go-dependencies:\n        patterns: ["*"]\n\n  - package-ecosystem: gradle\n    directory: "/gui/android"\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n    groups:\n      android-dependencies:\n        patterns: ["*"]\n\n  - package-ecosystem: github-actions\n    directory: "/"\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 3\n    groups:\n      github-actions:\n        patterns: ["*"]\n''')

      - name: Validate bootstrap diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git grep -nE 'go 1\.25\.12|gradle-8\.7-bin|compileSdk = 34|targetSdk = 34|compose-bom:2024\.09\.03|io\.coil-kt:coil-compose:2\.7\.0' -- go.mod gui/android packaging/fdroid
          grep -q 'go 1.25.13' go.mod
          grep -q 'com.android.application") version "9.3.1"' gui/android/build.gradle.kts
          grep -q 'compose-bom:2026.08.00' gui/android/app/build.gradle.kts

      - name: Commit bootstrap updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modernize dependencies and Android build toolchain"
          git push origin HEAD:dev
